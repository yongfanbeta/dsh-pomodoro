name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push cancels the CI still running for the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Run test suite
        # The plugin has zero runtime dependencies, so `npm ci` / `npm install`
        # is not required; tests run straight off the source tree.
        run: npm test

  # Guard the "loads inside a real DSH" contract without a full DSH runtime:
  # at minimum the host half must import and expose name/apply/inject.
  sanity:
    name: Package sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate package.json
        run: |
          node -e "const p = JSON.parse(require('fs').readFileSync('package.json', 'utf8')); if (!p.name || !p.version) throw new Error('missing name or version')"

      - name: Host half imports and exposes the plugin contract
        run: |
          node --input-type=module -e "import('./lib/index.js').then(m => { for (const k of ['name', 'apply', 'inject']) { if (!(k in m)) throw new Error('missing export ' + k) } console.log('host contract ok ' + m.name) })"
